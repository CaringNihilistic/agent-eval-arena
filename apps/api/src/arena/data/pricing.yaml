# Models the runner may call. A model with no entry here is refused.
#
# billing:
#   free          a free API tier; actual cost is $0
#   subscription  covered by a subscription login; actual cost is $0
#   paid          billed per token; refused unless explicitly overridden
#
# "reference" is the provider's paid list price in USD per million tokens. It is
# used only for the "at paid rates" figures; nothing is charged at these rates.
#
# Every number here was read from the provider's official page on the date in
# "checked". Do not edit from memory: re-read the page and update the date.

models:
  gemini/gemini-3.8-flash:
    provider: gemini
    billing: free
    backends: [litellm]
    reference:
      input_per_mtok: 0.75
      output_per_mtok: 3.75
      source: https://ai.google.dev/gemini-api/docs/pricing
      checked: 2026-10-02
      note: Promotional price through 2026-12-31; 1.50 / 7.50 from 2027-01-01.
    free_tier:
      source: https://aistudio.google.com/rate-limit
      checked: 2026-10-02
      note: >-
        Not published in the docs; read by the owner from the AI Studio rate-limit
        page for their project. The page shows no daily token limit.
      requests_per_minute: 5
      requests_per_day: 20
      tokens_per_minute: 250000
      tokens_per_day: null

  # Not used by any config. Kept so the finding in docs/FINDINGS.md can be reproduced:
  # this model calls its built-in `python` tool instead of python_exec.
  groq/openai/gpt-oss-120b:
    provider: groq
    billing: free
    backends: [litellm]
    reference:
      input_per_mtok: 0.15
      output_per_mtok: 0.60
      source: https://console.groq.com/docs/models
      checked: 2026-10-02
    free_tier:
      source: https://console.groq.com/docs/rate-limits
      checked: 2026-10-02
      requests_per_minute: 30
      requests_per_day: 1000
      tokens_per_minute: 8000
      tokens_per_day: 200000

  groq/qwen/qwen3.8-27b:
    provider: groq
    billing: free
    backends: [litellm]
    reference:
      input_per_mtok: 0.80
      output_per_mtok: 4.00
      source: https://console.groq.com/docs/models
      checked: 2026-10-02
    free_tier:
      source: https://console.groq.com/docs/rate-limits
      checked: 2026-10-02
      note: >-
        The page lists 8,000 tokens per minute. The API's own 429 on 2026-10-02 named
        a limit of 7,000 input tokens per minute, so the enforced figure is used here.
      requests_per_minute: 30
      requests_per_day: 1000
      tokens_per_minute: 7000
      tokens_per_day: 200000
