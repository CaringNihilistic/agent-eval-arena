[project]
name = "arena"
version = "0.1.0"
description = "Agent Eval Arena API: agent runner, scorers, leaderboards."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "litellm>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
arena = "arena.cli:app"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "jsonschema[format]>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/arena/schema_gen.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
