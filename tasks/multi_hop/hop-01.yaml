id: hop-01
title: "When the previous director took office"
category: multi_hop
difficulty: medium
prompt: |
  In what year did the person who led the Tidewater Transit Authority before its current director take up that post?
  Answer with the year only.
required_tools: [search_docs]
scorer_type: numeric_tolerance
scorer_config:
  expected: 2012
  tolerance: 0
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "2012"
    - "In 2012"
  wrong:
    - "2021"
    - "2013"
    - "2011"
