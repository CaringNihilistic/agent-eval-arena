id: hop-06
title: "Regatta sponsor's founding gap"
category: multi_hop
difficulty: hard
prompt: |
  How many years after the Bay Regatta was first held was the organisation that now sponsors it founded?
  Answer with the number only.
required_tools: [search_docs, calculator]
scorer_type: numeric_tolerance
scorer_config:
  expected: 71
  tolerance: 0
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "71"
    - "71 years"
  wrong:
    - "85"
    - "14"
    - "1994"
