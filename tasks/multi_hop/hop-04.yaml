id: hop-04
title: "Age of the lighthouse behind the lens"
category: multi_hop
difficulty: medium
prompt: |
  The Maritime Museum displays the original lens of a lighthouse. In what year was that lighthouse built?
  Answer with the year only.
required_tools: [search_docs]
scorer_type: numeric_tolerance
scorer_config:
  expected: 1892
  tolerance: 0
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "1892"
  wrong:
    - "1978"
    - "1962"
    - "1858"
