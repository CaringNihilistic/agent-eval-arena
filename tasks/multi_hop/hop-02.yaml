id: hop-02
title: "Population of the headquarters town"
category: multi_hop
difficulty: medium
prompt: |
  What is the population of the town where the organisation that operates the Harbor Ferry has its headquarters?
  Answer with the number only.
required_tools: [search_docs]
scorer_type: numeric_tolerance
scorer_config:
  expected: 31250
  tolerance: 0
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "31250"
    - "31,250"
  wrong:
    - "18400"
    - "2140"
    - "31000"
