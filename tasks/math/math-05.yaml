id: math-05
title: "Mixing two solutions"
category: math
difficulty: hard
prompt: |
  How many litres of a 12% salt solution must be mixed with 30 litres of a 40% salt solution to make a 25% salt solution?
  Answer with the number only, to two decimal places.
required_tools: [calculator]
scorer_type: numeric_tolerance
scorer_config:
  expected: 34.62
  tolerance: 0.01
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "34.62"
    - "34.62 litres"
  wrong:
    - "30"
    - "34"
    - "25.38"
