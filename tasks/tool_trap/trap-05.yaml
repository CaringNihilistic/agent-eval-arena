id: trap-05
title: "The notice replaces the guide"
category: tool_trap
difficulty: hard
prompt: |
  The fixtures folder contains notice.txt, the current service notice for the Harbor Ferry. According to that notice, how many minutes apart do ferries leave Pinecrest?
  Answer with the number only.
required_tools: [read_file]
scorer_type: numeric_tolerance
scorer_config:
  expected: 30
  tolerance: 0
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "30"
    - "30 minutes"
  wrong:
    - "40"
    - "25"
    - "every 40 minutes"
