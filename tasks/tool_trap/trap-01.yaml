id: trap-01
title: "Days between two dates"
category: tool_trap
difficulty: medium
prompt: |
  How many days are there from 15 January 2026 to 3 November 2026? Count the end date but not the start date.
  Answer with the number only.
required_tools: [python_exec]
scorer_type: numeric_tolerance
scorer_config:
  expected: 292
  tolerance: 0
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "292"
    - "292 days"
  wrong:
    - "293"
    - "291"
    - "288"
