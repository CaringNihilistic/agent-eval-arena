id: trap-03
title: "Counting lines in a large log"
category: tool_trap
difficulty: hard
prompt: |
  The file server.log in the fixtures folder has one entry per line, in the form: timestamp, level, service, message. How many lines have the level ERROR?
  Answer with the number only.
required_tools: [python_exec]
scorer_type: numeric_tolerance
scorer_config:
  expected: 159
  tolerance: 0
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "159"
    - "159 lines"
  wrong:
    - "160"
    - "4200"
    - "158"
