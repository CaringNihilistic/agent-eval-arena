id: data-02
title: "Region with the most completed revenue"
category: data_analysis
difficulty: easy
prompt: |
  Using orders.csv in the fixtures folder (columns: order_id, order_date, customer, region, product, quantity, unit_price, status), which region has the highest total revenue from completed orders? Revenue is quantity times unit_price.
  Answer with the region name only.
required_tools: [python_exec]
scorer_type: exact
scorer_config:
  expected: "south"
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "south"
    - "South"
    - " south. "
  wrong:
    - "east"
    - "north"
    - "south and east"
