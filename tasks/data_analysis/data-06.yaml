id: data-06
title: "Mean of a column with gaps"
category: data_analysis
difficulty: medium
prompt: |
  The file sensor_readings.csv in the fixtures folder has the columns timestamp, sensor, temperature_c, humidity_pct. Some temperature readings are blank. What is the mean temperature of sensor B, leaving out the blank readings?
  Answer with the number only, to two decimal places.
required_tools: [python_exec]
scorer_type: numeric_tolerance
scorer_config:
  expected: 22.97
  tolerance: 0.01
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "22.97"
    - "22.97 C"
  wrong:
    - "19.61"
    - "21.21"
    - "23"
