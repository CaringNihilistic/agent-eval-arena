id: data-01
title: "Revenue from completed orders"
category: data_analysis
difficulty: easy
prompt: |
  The file orders.csv in the fixtures folder has the columns order_id, order_date, customer, region, product, quantity, unit_price, status. Revenue for an order is quantity times unit_price. What is the total revenue of the orders whose status is completed?
  Answer with the number only, to two decimal places.
required_tools: [python_exec]
scorer_type: numeric_tolerance
scorer_config:
  expected: 21616.45
  tolerance: 0.01
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "21616.45"
    - "$21,616.45"
  wrong:
    - "25486.40"
    - "21616"
    - "3869.95"
