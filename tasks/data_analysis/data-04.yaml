id: data-04
title: "Items below their reorder point"
category: data_analysis
difficulty: easy
prompt: |
  The file inventory.csv in the fixtures folder has the columns sku, name, category, stock, reorder_point, unit_cost. How many items have stock strictly below their reorder point?
  Answer with the number only.
required_tools: [python_exec]
scorer_type: numeric_tolerance
scorer_config:
  expected: 10
  tolerance: 0
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "10"
    - "10 items"
  wrong:
    - "9"
    - "11"
    - "14"
