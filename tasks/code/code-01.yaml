id: code-01
title: "Fix the median function"
category: code
difficulty: easy
prompt: |
  This function should return the median of a list of numbers, but it is wrong for lists with an even number of items, where the median is the mean of the two middle values. It should also raise ValueError for an empty list.

  def median(values):
      ordered = sorted(values)
      middle = len(ordered) // 2
      return ordered[middle]

  Answer with the corrected Python function only.
required_tools: [python_exec]
scorer_type: python_check
scorer_config:
  checker: code_tests
  # The checker runs the agent's code, so a hang or crash is the answer's failure.
  crash_is_failure: true
  function: median
  # Hidden tests. Never sent to the agent or the browser.
  cases:
    - {"args": [[1, 3, 2]], "expected": 2}
    - {"args": [[4, 1, 3, 2]], "expected": 2.5}
    - {"args": [[5]], "expected": 5}
    - {"args": [[1, 2]], "expected": 1.5}
    - {"args": [[7, 7, 7, 7]], "expected": 7}
    - {"args": [[-5, 10]], "expected": 2.5}
    - {"args": [[9, 1, 5, 3, 7]], "expected": 5}
    - {"args": [[]], "raises": "ValueError"}
# Answers the scorer must accept and reject. Used only by the tests.
examples:
  correct:
    - "def median(values):\n    if not values:\n        raise ValueError(\"median of an empty list\")\n    ordered = sorted(values)\n    middle = len(ordered) // 2\n    if len(ordered) % 2:\n        return ordered[middle]\n    return (ordered[middle - 1] + ordered[middle]) / 2"
    - "```python\ndef median(values):\n    if len(values) == 0:\n        raise ValueError('empty')\n    s = sorted(values)\n    n = len(s)\n    return s[n // 2] if n % 2 else (s[n // 2 - 1] + s[n // 2]) / 2\n```"
  wrong:
    - "def median(values):\n    ordered = sorted(values)\n    middle = len(ordered) // 2\n    return ordered[middle]"
    - "def median(values):\n    return sum(values) / len(values)"
    - "The bug is in the middle index."
    - "def median(values)\n    return 1"
